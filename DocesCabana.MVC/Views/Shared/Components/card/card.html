<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card</title>
  <link rel="stylesheet" href="card.css">
</head>

<body>
  <div class="card">
    <div class="img-placeholder" style="background:#fdf6f6;"><img src="" alt="raspatacho"></div>
    <div class="name">Raspa Tacho</div>
    <div class="price">R$ 19,99</div>
    <div class="bottom">
      <div class="controls">
        <button class="qty-btn" onclick="change(this,-1)">−</button>
        <span class="qty">1</span>
        <button class="qty-btn" onclick="change(this,1)">+</button>
      </div>
      <button class="add-btn">Adicionar</button>
    </div>
  </div>
  <script>
    function change(btn, delta) {
      const ctrl = btn.closest('.controls');
      const span = ctrl.querySelector('.qty');
      let v = parseInt(span.textContent) + delta;
      if (v < 1) v = 1;
      span.textContent = v;
    }
  </script>

</body>

</html>
